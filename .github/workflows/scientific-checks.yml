name: Scientific finite checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run owned finite science from the flat artifact repository root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../scientific-output
          ulimit -v 2560000
          ulimit -t 900
          timeout --signal=TERM --kill-after=10s 900s python -B scripts/reproduce.py \
            --report ../scientific-output/recheck.json \
            --raw-output ../scientific-output/raw \
            2>&1 | tee ../scientific-output/driver.txt
      - name: Retain raw outputs even when a scientific gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-output
          path: ../scientific-output/
          if-no-files-found: warn
          retention-days: 14
